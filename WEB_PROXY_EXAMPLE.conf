# Example for nginx, adapt hostname + TLS certificate for your deployment.
# In http {} block, define:
#   limit_req_zone $binary_remote_addr zone=sonar_api:10m rate=5r/s;
server {
    listen 443 ssl http2;
    server_name sonar.example.org;
    ssl_certificate /etc/letsencrypt/live/sonar.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonar.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;

    # Long-running admin diagnostics bundle; keep separate from ordinary UI timeouts.
    location = /api/diagnostics/bundle {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Browser SSH terminal requires an explicit WebSocket upgrade path.
    location ^~ /api/terminal/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        limit_req zone=sonar_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
}

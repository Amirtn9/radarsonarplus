# Example for nginx, adapt hostname + TLS certificate for your deployment.
# In http {} block, define: limit_req_zone $binary_remote_addr zone=sonar_api:10m rate=5r/s;
server {
    listen 443 ssl http2;
    server_name sonar.example.org;
    ssl_certificate /etc/letsencrypt/live/sonar.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonar.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    location / {
        limit_req zone=sonar_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            lock: ci-py310.lock
          - python-version: '3.11'
            lock: ci-py311.lock
          - python-version: '3.12'
            lock: ci-py312.lock
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sonar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TEST_DB_DSN: dbname=sonar_ci user=postgres host=127.0.0.1 port=5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/${{ matrix.lock }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 libpango-1.0-0 libpangoft2-1.0-0
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/${{ matrix.lock }}
      - name: Record test environment
        run: |
          python -VV > "$RUNNER_TEMP/test-environment.txt"
          python -m pip freeze >> "$RUNNER_TEMP/test-environment.txt"
          sha256sum requirements/${{ matrix.lock }} >> "$RUNNER_TEMP/test-environment.txt"
      - name: Prepare checksum-verified Xray runtimes
        run: python scripts/prepare_test_xray.py --output "$RUNNER_TEMP/test-xray" --github-env "$GITHUB_ENV"
      - name: Python compilation
        run: python -m compileall -q .
      - name: Dependency consistency
        run: python -m pip check
      - name: Regression tests with real PostgreSQL and Xray
        run: python -m pytest -q --disable-warnings --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: Publish regression failure diagnostics
        if: failure()
        run: |
          python - <<'PYTEST_DIAGNOSTICS'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'pytest.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      detail = (case.get('name', '') + '\n' + ''.join(failure.itertext()))[:16000]
                      escaped = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error::' + escaped)
          PYTEST_DIAGNOSTICS
      - name: Shell syntax
        run: bash -n install.sh install_web_panel.sh scripts/*.sh
      - name: JavaScript syntax
        run: for file in pro_web/static/*.js scripts/*.cjs; do node --check "$file"; done
      - name: Source preflight
        run: bash install.sh --check
      - name: Source manifest
        run: python scripts/verify_manifest.py
      - name: Deterministic release archive
        run: |
          python scripts/build_release.py
          sha256sum dist/SONAR-RADAR-PRO-$(cat VERSION).zip
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest.xml
            ${{ runner.temp }}/test-environment.txt
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sonar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TEST_DB_DSN: dbname=sonar_ci user=postgres host=127.0.0.1 port=5432
      SONAR_BROWSER_FIXTURE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci-py312.lock
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-py312.lock
          npm ci
          npx playwright install --with-deps chromium
      - name: All browser smoke tests against disposable HTTPS fixture
        env:
          SONAR_BROWSER_TEST_OUTPUT: ${{ runner.temp }}/browser-artifacts
        run: python scripts/run_browser_tests.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: warn

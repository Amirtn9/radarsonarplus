name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
            requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: python -m pip install -r requirements-web.txt -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q .
      - name: Dependency consistency
        run: python -m pip check
      - name: Regression tests
        run: python -m pytest -q --disable-warnings
      - name: Shell syntax
        run: bash -n install.sh install_web_panel.sh scripts/*.sh
      - name: JavaScript syntax
        run: for file in pro_web/static/*.js; do node --check "$file"; done
      - name: Source preflight
        run: bash install.sh --check
      - name: Source manifest
        run: python scripts/verify_manifest.py
      - name: Deterministic release archive
        run: |
          python scripts/build_release.py
          sha256sum dist/SONAR-RADAR-PRO-$(cat VERSION).zip

name: Static correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install hash-verified lint tool
        run: python -m pip install --require-hashes -r requirements-lint.txt
      - name: Undefined names and invalid exports
        run: ruff check --select F821,F822,F823 --exclude tests --exclude .venv --exclude node_modules .
